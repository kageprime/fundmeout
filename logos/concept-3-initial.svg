<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Concept 3 Initial / App Icon (The Emerald Smile Badge) -->
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="30" fill="url(#emeraldGrad)"/>
  <rect x="2" y="2" width="116" height="116" rx="28" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Iconic Smile Face -->
  <g transform="translate(20, 20)">
    <path d="M 24 32 Q 32 23 40 32" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M 48 32 Q 56 23 64 32" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M 22 48 Q 44 74 66 48" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" fill="none"/>
