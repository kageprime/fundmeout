<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="FundMeOut primary blue on light">
  <rect width="800" height="260" fill="white"/>
  <style>
    .word { font-family: 'Plus Jakarta Sans',system-ui,sans-serif; font-weight: 800; letter-spacing: -0.04em; }
    .tag { font-family: 'Inter',system-ui,sans-serif; font-weight: 300; letter-spacing: 0.02em; }
  </style>
  <g transform="translate(42,0)">
    <text x="0" y="145" class="word" font-size="104" fill="#0052FF" textLength="348" lengthAdjust="spacingAndGlyphs">FundMe</text>
