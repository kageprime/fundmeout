<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Concept 1: Animated Splash/Loading Screen SVG -->
  <style>
    @keyframes pulseRing {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    @keyframes winkEyes {
      0%, 80%, 100% { transform: scaleY(1); }
      90% { transform: scaleY(0.1); }
    }
    @keyframes smileDraw {
      0% { stroke-dashoffset: 40; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .spinner-circle {
      animation: pulseRing 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: center;
    }
    .eyes-group {
      animation: winkEyes 3.5s ease-in-out infinite;
      transform-origin: 80px 65px;
    }
    .smile-path {
      stroke-dasharray: 40;
      animation: smileDraw 2s ease-in-out infinite alternate;
    }
  </style>

  <g class="spinner-circle">
    <!-- Background glow / soft backing -->
    <circle cx="80" cy="80" r="60" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Animated Wink Eyes -->
    <g class="eyes-group">
      <path d="M 58 64 Q 65 54 72 64" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M 88 64 Q 95 54 102 64" stroke="#0F172A" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Animated Smile Arc -->
    <path class="smile-path" d="M 56 86 Q 80 114 104 86" stroke="#10B981" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
