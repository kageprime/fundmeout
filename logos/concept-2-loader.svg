<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- FundMeOut Kinetic Loading Screen SVG -->
  <defs>
    <linearGradient id="loaderSmileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#06FF2E"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes drawSmile {
      0% {
        stroke-dashoffset: 140;
        transform: scale(0.92);
        opacity: 0.4;
      }
      50% {
        stroke-dashoffset: 0;
        transform: scale(1.04);
        opacity: 1;
      }
      100% {
        stroke-dashoffset: -140;
        transform: scale(0.92);
        opacity: 0.4;
      }
    }

    @keyframes pulseEyes {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #00F0FF); }
    }

    @keyframes flickPop {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.3) rotate(5deg); opacity: 1; filter: drop-shadow(0 0 8px #06FF2E); }
    }

    @keyframes haloSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .smile-stroke {
      stroke-dasharray: 140;
      animation: drawSmile 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      transform-origin: 80px 92px;
    }

    .eye-left {
      animation: pulseEyes 2.2s ease-in-out infinite;
      transform-origin: 58px 60px;
    }

    .eye-right {
      animation: pulseEyes 2.2s ease-in-out 0.15s infinite;
      transform-origin: 102px 60px;
    }

    .dimple-flick {
      animation: flickPop 2.2s ease-in-out infinite;
      transform-origin: 124px 92px;
    }

    .outer-halo {
      animation: haloSpin 6s linear infinite;
      transform-origin: center;
    }
  </style>

  <!-- Dark tech backing disc -->
  <rect width="160" height="160" rx="36" fill="#08080F"/>
  <rect x="2" y="2" width="156" height="156" rx="34" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Subtle ambient halo ring -->
  <circle class="outer-halo" cx="80" cy="80" r="64" stroke="rgba(0, 71, 255, 0.25)" stroke-width="2.5" stroke-dasharray="24 16"/>

  <!-- Eyes / Community beacons -->
  <circle class="eye-left" cx="58" cy="60" r="7.5" fill="#FFFFFF"/>
  <circle class="eye-right" cx="102" cy="60" r="7.5" fill="#FFFFFF"/>

  <!-- The Animated Uplift Smile Bridge -->
  <path class="smile-stroke" d="M 38 88 C 58 120, 102 120, 122 88" stroke="url(#loaderSmileGrad)" stroke-width="8.5" stroke-linecap="round" fill="none"/>
  
  <!-- Left start anchor dot -->
  <circle cx="38" cy="88" r="4.5" fill="#0047FF"/>

  <!-- Uplift terminal flick -->
  <g class="dimple-flick">
    <path d="M 116 78 C 124 81, 129 85, 133 89 C 128 94, 122 98, 116 99 C 120 92, 121 85, 116 78 Z" fill="#06FF2E"/>
  </g>
</svg>
