<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Concept 1 Initial / App Icon -->
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad1)"/>

  <!-- Glowing subtle inner rim -->
  <rect x="2" y="2" width="116" height="116" rx="28" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Centered Joyful Smile Icon -->
  <g transform="translate(20, 20)">
    <!-- Main Ring -->
    <circle cx="40" cy="40" r="35" stroke="#FFFFFF" stroke-width="7.5" fill="none" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <path d="M 27 30 Q 32 23 37 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 43 30 Q 48 23 53 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Smile -->
    <path d="M 26 44 Q 40 60 54 44" stroke="#10B981" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
