<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="100%" height="100%" fill="none">
  <!-- Concept 1: Joyful 'O' (Harmonized with Brand Kit) -->
  <defs>
    <linearGradient id="c1Blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#0035D0" />
    </linearGradient>
    <linearGradient id="c1Smile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#06FF2E" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
    .c1-text {
      font-family: 'Plus Jakarta Sans', 'Satoshi', -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
  </style>

  <g transform="translate(20, 20)">
    <text x="0" y="86" class="c1-text" font-size="78" fill="url(#c1Blue)">FundMe</text>

    <!-- The Smiling O -->
    <g transform="translate(346, 18)">
      <circle cx="36" cy="36" r="32" stroke="url(#c1Blue)" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 22 26 Q 28 20 34 26" stroke="url(#c1Blue)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 38 26 Q 44 20 50 26" stroke="url(#c1Blue)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 22 42 Q 36 58 50 42" stroke="url(#c1Smile)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>

    <text x="432" y="86" class="c1-text" font-size="78" fill="url(#c1Blue)">ut</text>
  </g>
</svg>
