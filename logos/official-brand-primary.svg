<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="100%" height="100%" fill="none">
  <!-- FundMeOut Official Integrated Smile Wordmark (Brand Guidelines Edition) -->
  <style>
    /* font fallback */
    .b-brand {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: -0.035em;
    }
  </style>

  <g transform="translate(15, 15)">
    <!-- "FundMe" in vibrant electric cobalt blue -->
    <text x="0" y="82" class="b-brand" font-size="82" fill="#0052FF">FundMe</text>

    <!-- Capital "O" with integrated inner smile arc -->
    <g transform="translate(348, 14)">
      <!-- Outer circular O -->
      <circle cx="34" cy="34" r="30" stroke="#0052FF" stroke-width="8.5" fill="none" stroke-linecap="round"/>
      <!-- Inner warm centered smile arc -->
      <path d="M 22 36 C 22 50, 46 50, 46 36" stroke="#0052FF" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Lowercase "u" with the distinctive smiling swooping baseline -->
    <path d="M 428 38 V 64 C 428 82, 458 82, 458 64 V 38" stroke="#0052FF" stroke-width="8.5" stroke-linecap="round" fill="none"/>

    <!-- Lowercase "t" -->
    <g transform="translate(470, 24)">
      <path d="M 8 0 V 62 C 8 72, 18 72, 22 70" stroke="#0052FF" stroke-width="8" stroke-linecap="round" fill="none"/>
      <path d="M 0 16 H 18" stroke="#0052FF" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
