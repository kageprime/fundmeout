<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Concept 3: Animated Pulse Loader -->
  <style>
    @keyframes spinTrack {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes smileScale {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .track-spinner {
      animation: spinTrack 2.4s linear infinite;
      transform-origin: center;
    }
    .center-face {
      animation: smileScale 1.8s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Outer orbiting loader arc -->
  <circle class="track-spinner" cx="80" cy="80" r="68" stroke="#10B981" stroke-width="6" stroke-dasharray="160 180" stroke-linecap="round"/>
  
  <!-- Centered smiling badge -->
  <circle cx="80" cy="80" r="50" fill="#10B981"/>
  
  <g class="center-face">
    <path d="M 64 70 Q 70 63 76 70" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 84 70 Q 90 63 96 70" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 62 84 Q 80 106 98 84" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
