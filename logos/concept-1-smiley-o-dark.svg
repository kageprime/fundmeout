<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="100%" height="100%" fill="none">
  <!-- Concept 1: Joyful 'O' (Dark Mode) -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
    .c1-dark-text {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
  </style>

  <rect width="560" height="160" rx="16" fill="#08080F"/>

  <g transform="translate(20, 20)">
    <text x="0" y="86" class="c1-dark-text" font-size="78" fill="#FFFFFF">FundMe</text>

    <!-- The Smiling O -->
    <g transform="translate(346, 18)">
      <circle cx="36" cy="36" r="32" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 22 26 Q 28 20 34 26" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 38 26 Q 44 20 50 26" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 22 42 Q 36 58 50 42" stroke="#00F0FF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    </g>

    <text x="432" y="86" class="c1-dark-text" font-size="78" fill="#FFFFFF">ut</text>
  </g>
</svg>
