<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- FundMeOut App Icon: Pure Smile Uplift (Amazon-style standalone symbol) -->
  <defs>
    <linearGradient id="smilePureBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080F"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="neonSmile" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="50%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#06FF2E"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#smilePureBg)"/>
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Glowing smile dots (eyes) -->
  <circle cx="44" cy="46" r="6.5" fill="#FFFFFF"/>
  <circle cx="76" cy="46" r="6.5" fill="#FFFFFF"/>

  <!-- The Iconic Uplifting Smile Sweep -->
  <path d="M 28 66 C 44 94, 76 94, 92 68" stroke="url(#neonSmile)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="28" cy="66" r="4.5" fill="#0047FF"/>
  <path d="M 86 60 C 93 63, 98 66, 101 70 C 96 74, 90 77, 84 78 C 88 72, 89 67, 86 60 Z" fill="#06FF2E"/>
</svg>
