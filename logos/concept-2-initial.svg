<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- FundMeOut App Icon: The Uplift F Monogram -->
  <defs>
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047FF"/>
      <stop offset="100%" stop-color="#002DB3"/>
    </linearGradient>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06FF2E"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>

  <!-- iOS / Android Squircle -->
  <rect width="120" height="120" rx="28" fill="url(#appBgGrad)"/>
  
  <!-- Subtle glass inner highlight rim -->
  <rect x="2" y="2" width="116" height="116" rx="26" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Bold Geometric 'F' with integrated uplifting curve -->
  <g transform="translate(26, 22)">
    <!-- Vertical stem with rounded ends -->
    <rect x="4" y="6" width="13" height="64" rx="6.5" fill="#FFFFFF"/>
    
    <!-- Top arm -->
    <rect x="4" y="6" width="56" height="13" rx="6.5" fill="#FFFFFF"/>
    
    <!-- Middle arm -->
    <rect x="4" y="32" width="40" height="12" rx="6" fill="#FFFFFF"/>

    <!-- Joyful Uplift Smile Gesture anchoring the F with terminal lift -->
    <path d="M 6 62 C 28 86, 52 86, 68 62" stroke="url(#smileGrad)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <circle cx="6" cy="62" r="3.5" fill="#06FF2E"/>
    
    <!-- Dimple lift flick -->
    <path d="M 62 56 C 68 59, 72 61, 75 64 C 71 68, 66 71, 61 72 C 64 67, 65 62, 62 56 Z" fill="#00F0FF"/>
  </g>
</svg>
